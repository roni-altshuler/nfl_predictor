name: Lint, contract tests, types, build and responsive production UI
description: Shared CI and publication checks; failures stop subsequent steps.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    # Vercel escalates ESLint warnings to errors, so this gate has to match
    # what the deploy will do. `npm run build` alone is not enough.
    - name: Lint
      shell: bash
      run: npx next lint

    - name: Forecast contract tests
      shell: bash
      run: npm test

    - name: Typecheck
      shell: bash
      run: npm run typecheck

    - name: Build
      shell: bash
      run: npm run build
      env:
        NEXT_TELEMETRY_DISABLED: '1'

    - name: Install browser
      shell: bash
      run: npx playwright install --with-deps chromium

    - name: Verify production UI
      env:
        AUDIT_USE_PUBLICATION_TIME: '1'
      shell: bash
      run: |
        npm start -- --hostname 127.0.0.1 --port 3012 > /tmp/nfl-preview.log 2>&1 &
        preview_pid=$!
        trap 'kill "$preview_pid" || true' EXIT
        ready=0
        for attempt in $(seq 1 30); do
          if curl --fail --silent http://127.0.0.1:3012/api/forecast-lab > /dev/null; then ready=1; break; fi
          sleep 1
        done
        test "$ready" -eq 1
        npm run test:browser
