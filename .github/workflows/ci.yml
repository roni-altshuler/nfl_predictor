name: CI

# Frontend and backend validation for every PR and push to main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/backend-checks

  frontend:
    name: Lint · Typecheck · Build
    # Playwright 1.60 supports Ubuntu 24.04; ubuntu-latest can advance beyond it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/frontend-checks
