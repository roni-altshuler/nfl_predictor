name: Weekly Benchmark

# Re-derives the measured state that every claim on the site rests on.
#
# Weekly rather than daily because a walk-forward over 6,500 games does not
# move meaningfully in 24 hours, and because the numbers quoted in CLAUDE.md
# and README.md should change on a schedule someone can notice rather than
# continuously.

on:
  schedule:
    # Tuesdays 13:00 UTC. The NFL week does not close until Monday night, so
    # a Monday run would score a week that is still being played.
    - cron: '0 13 * * 2'
  workflow_dispatch:

concurrency:
  group: weekly-benchmark
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore the warehouse
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download warehouse-latest \
            --pattern 'warehouse.sqlite.gz' --dir /tmp --clobber
          gunzip -f /tmp/warehouse.sqlite.gz
          mv /tmp/warehouse.sqlite backend/data/warehouse.sqlite

      - name: Integrity check
        run: python -m backend.scripts.validate_warehouse_integrity

      - name: Market benchmark
        # Scores the model, Elo-only and the constant base rate against the
        # de-vigged closing line, walk-forward. If the model ever comes out
        # ahead of the market this step logs a WARNING rather than a triumph:
        # it carries no market features, so that result is a bug announcing
        # itself.
        run: python -m backend.scripts.benchmark_market

      - name: Rebuild the whole archive
        # The FULL rebuild lives here rather than in the daily job because the
        # thing that makes past seasons change is the MODEL changing: every
        # archived game carries a retrodiction, and `build_history` reads them
        # from the `retrodictions.json` the step above just rewrote. The daily
        # job refreshes only the season in progress.
        run: python -m backend.scripts.build_history

      - name: Commit refreshed diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/data/diagnostics/ backend/data/history/ || true
          if git diff --cached --quiet -I'"generated_at":'; then
            echo "diagnostics unchanged"
          else
            git commit -m "chore: refresh benchmarks [automated]"
            git pull --rebase --autostash origin main || true
            git push
          fi
